<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AusCheckt is - QR Flyer</title>
    <style>
    @font-face {
      font-family: "Old London";
      src: url("../assets/font_old_london/OldLondon.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --primary: #457c43;
      --ink: #1f241f;
      --muted: #5f665f;
      --paper: #fbfaf7;
      --line: #d9ddd4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .flyer {
      width: min(210mm, 100%);
      min-height: min(297mm, 100vh - 48px);
      background: linear-gradient(180deg, #fffdf9 0%, #faf7ef 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22mm 18mm 18mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      box-shadow: 0 18px 40px rgba(28, 38, 24, 0.08);
      position: relative;
      overflow: hidden;
    }

    .flyer::before,
    .flyer::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(69, 124, 67, 0.12);
      border-radius: 14px;
      pointer-events: none;
    }

    .flyer::after {
      inset: 26px;
      border-style: dashed;
      border-color: rgba(69, 124, 67, 0.08);
    }

    .brand {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .brand h1 {
      margin: 0;
      font-family: "Old London", serif;
      font-size: clamp(3.2rem, 8vw, 5.8rem);
      line-height: 0.95;
      color: var(--primary);
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 10px 0 0;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.35;
      color: var(--primary);
      font-weight: 700;
    }

    .qr-wrap {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 14px;
      width: 100%;
      max-width: 170mm;
      margin: 0 auto;
    }

    .qr-frame {
      width: min(120mm, 78vw);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      padding: 8mm;
      border: 3px solid var(--primary);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(69, 124, 67, 0.08);
    }

    .qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .flyer h2 {
      margin: 0;
      font-size: clamp(1.15rem, 2.6vw, 1.8rem);
      line-height: 1.2;
      text-align: center;
      color: var(--ink);
      max-width: none;
      white-space: nowrap;
    }

    .fallback {
      text-align: center;
      display: grid;
      gap: 6px;
      justify-items: center;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .fallback .url {
      font-size: clamp(1.1rem, 2.6vw, 1.5rem);
      color: var(--primary);
      font-weight: 700;
      word-break: break-word;
    }

    @media screen and (max-width: 700px) {
      body {
        padding: 12px;
      }

      .flyer {
        min-height: calc(100vh - 24px);
        padding: 22px 16px 18px;
      }

      .qr-frame {
        width: min(78vw, 92mm);
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body {
        padding: 0;
        background: #ffffff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .flyer {
        width: 100%;
        min-height: calc(297mm - 20mm);
        border-radius: 0;
        box-shadow: none;
        border: 0.5pt solid var(--line);
        break-inside: avoid;
      }

      .flyer::before,
      .flyer::after {
        inset: 14px;
      }

      .brand h1 {
        font-size: 6.8rem;
        white-space: nowrap;
      }

      .brand p {
        font-size: 1.8rem;
      }

      .flyer h2 {
        font-size: 2.15rem;
      }

      .qr-frame {
        width: 126mm;
      }

      .fallback .url {
        font-size: 2rem;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
  </head>
  <body>
    <main class="flyer" aria-label="AusCheckt is QR Flyer">
      <section class="brand" aria-label="Branding">
        <h1>AusCheckt is</h1>
        <p>Wo auscheckt is, wo ausg'steckt is.</p>
      </section>

      <section class="qr-wrap" aria-label="QR Code Bereich">
        <div class="qr-frame">
          <img src="./qr_31er.svg" alt="QR Code für AusCheckt is" />
        </div>
        <h2>Scannen und Heurige auschecken.</h2>
      </section>

      <section class="fallback" aria-label="Fallback URL">
        <a class="url"
          href="https://auschecktis.at/">auschecktis.at</a>
      </section>
    </main>
  </body>
</html>
